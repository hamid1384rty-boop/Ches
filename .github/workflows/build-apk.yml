name: Build APK from ZIP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          echo "ZIP file: $ZIP"
          test -n "$ZIP"
          unzip -q -o "$ZIP" -d _src
          DIR=$(dirname "$(find _src -name settings.gradle.kts | head -n 1)")
          echo "Project dir: $DIR"
          test -f "$DIR/settings.gradle.kts"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: chess-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
